name: Publicar en teskel.online/helados

# En cada push a main: corre los tests y copia la página (y el .zip de la
# extensión) a la carpeta helados/ del repo del Space "teskel" en Spacefast.
# Spacefast publica teskel solo.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publicar-en-teskel-helados
  cancel-in-progress: false

env:
  TESKEL_SPACE_ID: spc_02ae51f4db5a45b3a6c013388fe16504
  CARPETA_DESTINO: helados

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests del normalizador y parsers
        run: node --test

  publicar:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repo app-helados
        uses: actions/checkout@v4
        with:
          path: app-src

      - name: Validar y armar lo que se publica
        working-directory: app-src
        run: |
          set -e
          for f in web/index.html web/app.js web/styles.css extension/manifest.json extension/background.js; do
            [ -f "$f" ] || { echo "::error::Falta $f"; exit 1; }
          done
          python3 -c "import json; json.load(open('extension/manifest.json'))"
          mkdir -p ../salida
          cp web/index.html web/app.js web/styles.css ../salida/
          (cd extension && zip -qr ../../salida/helados-extension.zip . -x '*.DS_Store')
          ls -la ../salida
          echo "OK: listo para publicar"

      - name: Pedir un remoto de push temporal para teskel
        env:
          SPACEFAST_TOKEN: ${{ secrets.SPACEFAST_TOKEN }}
        run: |
          if [ -z "$SPACEFAST_TOKEN" ]; then
            echo "::error::Falta el secreto SPACEFAST_TOKEN en Settings → Secrets → Actions."; exit 1
          fi
          respuesta=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.spacefast.com/v1/spaces/${TESKEL_SPACE_ID}/source/push-remote" \
            -H "Authorization: Bearer ${SPACEFAST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"ttlSeconds": 900}')
          codigo=$(echo "$respuesta" | tail -n1)
          cuerpo=$(echo "$respuesta" | sed '$d')
          if [ "$codigo" -ge 300 ]; then
            echo "::error::Spacefast respondió $codigo al pedir el remoto: $(echo "$cuerpo" | jq -r '.code // .title // .')"
            exit 1
          fi
          url=$(echo "$cuerpo" | jq -r '[.. | objects | .pushUrl? // empty][0]')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::La respuesta de Spacefast no trae pushUrl."; exit 1
          fi
          echo "::add-mask::$url"
          echo "TESKEL_REMOTE=$url" >> "$GITHUB_ENV"

      - name: Clonar teskel
        run: git clone --quiet --depth 1 --branch main "$TESKEL_REMOTE" teskel

      - name: Copiar a teskel/helados
        run: |
          mkdir -p "teskel/${CARPETA_DESTINO}"
          rsync -a --delete \
            --include 'index.html' --include 'app.js' --include 'styles.css' --include 'helados-extension.zip' \
            --exclude '*' \
            salida/ "teskel/${CARPETA_DESTINO}/"

      - name: Commit y push a teskel
        working-directory: teskel
        env:
          MENSAJE_ORIGEN: ${{ github.event.head_commit.message }}
        run: |
          git add -A "${CARPETA_DESTINO}"
          if git diff --cached --quiet; then
            echo "Sin cambios en ${CARPETA_DESTINO}/; no hay nada que publicar."; exit 0
          fi
          git -c user.name="app-helados (GitHub Actions)" \
              -c user.email="actions@users.noreply.github.com" \
              commit -q -m "helados: sincronizar desde monticoagustin/app-helados@${GITHUB_SHA::7}" \
                        -m "${MENSAJE_ORIGEN:-Ejecución manual}"
          git push --quiet origin HEAD:main
          echo "Publicado: https://teskel.online/${CARPETA_DESTINO}/"
